<canvas id="pc" hidden></canvas>
<script>
//CORE
const L={cx0:[17,62,107,152],bx:9,bp:7.6,y0:118,rp:10,R:3.25,mx:12,my:12,W:186,H:273,ref:[185,222]};
const uv=(x,y)=>[(x-L.mx)/L.W,(y-L.my)/L.H];
let VB=null,SB=null,MKN=0;
function findMarkers(g,w,h){
 if(!VB||VB.length!==w*h){VB=new Uint8Array(w*h);SB=new Int32Array(w*h)}
 const vis=VB,st=SB;vis.fill(0);
 const sm=[];for(let i=0;i<g.length;i+=37)sm.push(g[i]);sm.sort((a,b)=>a-b);
 const th=Math.min(165,Math.max(50,sm[sm.length*.9|0]*.62)),zx=w*.28,zy=h*.25,mn=Math.min(w,h),lo=mn*.011,hi=mn*.12,cs=[];
 for(let y=2;y<h-2;y+=2){if(!(y<zy||y>h-zy))continue;
  for(let x=2;x<w-2;x+=2){if(!(x<zx||x>w-zx))continue;const p=y*w+x;if(vis[p]||g[p]>th)continue;
   let sp=0,x0=x,x1=x,y0=y,y1=y,a=0,sx=0,sy=0,big=false;st[sp++]=p;vis[p]=1;
   while(sp){const c=st[--sp],cx=c%w,cy=(c-cx)/w;a++;sx+=cx;sy+=cy;
    if(cx<x0)x0=cx;if(cx>x1)x1=cx;if(cy<y0)y0=cy;if(cy>y1)y1=cy;
    if(x1-x0>hi*1.5||y1-y0>hi*1.5){big=true;break}
    if(cx>0&&!vis[c-1]&&g[c-1]<=th){vis[c-1]=1;st[sp++]=c-1}
    if(cx<w-1&&!vis[c+1]&&g[c+1]<=th){vis[c+1]=1;st[sp++]=c+1}
    if(cy>0&&!vis[c-w]&&g[c-w]<=th){vis[c-w]=1;st[sp++]=c-w}
    if(cy<h-1&&!vis[c+w]&&g[c+w]<=th){vis[c+w]=1;st[sp++]=c+w}}
   const bw=x1-x0+1,bh=y1-y0+1;
   if(!big&&bw>=lo&&bw<=hi&&bh>=lo&&bh<=hi&&Math.min(bw,bh)/Math.max(bw,bh)>.7&&a/(bw*bh)>.65)cs.push({x:sx/a,y:sy/a,s:(bw+bh)/2})}}
 MKN=cs.length;const pick=(qx,qy)=>{let b=null,bd=1e18;for(const c of cs){if((c.x<w/2)!==(qx===0)||(c.y<h/2)!==(qy===0))continue;const d=(c.x-qx)**2+(c.y-qy)**2;if(d<bd){bd=d;b=c}}return b};
 const m=[pick(0,0),pick(w,0),pick(0,h),pick(w,h)];if(m.some(v=>!v))return null;
 const ss=m.map(v=>v.s);if(Math.max(...ss)/Math.min(...ss)>1.8)return null;
 const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),r=((D(m[0],m[1])+D(m[2],m[3]))/2)/((D(m[0],m[2])+D(m[1],m[3]))/2);
 return(r>.5&&r<.85)?m:null}
function homog(m){const[p0,p1,p2,p3]=m;
 const dx1=p1.x-p3.x,dx2=p2.x-p3.x,dx3=p0.x-p1.x+p3.x-p2.x,dy1=p1.y-p3.y,dy2=p2.y-p3.y,dy3=p0.y-p1.y+p3.y-p2.y,det=dx1*dy2-dx2*dy1;
 const g=(dx3*dy2-dx2*dy3)/det,k=(dx1*dy3-dx3*dy1)/det,a=p1.x-p0.x+g*p1.x,b=p2.x-p0.x+k*p2.x,d=p1.y-p0.y+g*p1.y,e=p2.y-p0.y+k*p2.y;
 return(u,v)=>{const q=g*u+k*v+1;return[(a*u+b*v+p0.x)/q,(d*u+e*v+p0.y)/q]}}
function disk(g,w,h,cx,cy,r){let s=0,n=0;const R=Math.max(1,r),x0=Math.max(0,Math.floor(cx-R)),x1=Math.min(w-1,Math.ceil(cx+R)),y0=Math.max(0,Math.floor(cy-R)),y1=Math.min(h-1,Math.ceil(cy+R));
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if((x-cx)**2+(y-cy)**2<=R*R){s+=g[y*w+x];n++}return n?s/n:255}
const XU=[.06144,.09641,.13161,.1666,.20148,.31851,.35353,.38851,.42367,.45862,.57561,.61057,.64559,.68076,.71565,.83268,.8677,.90268,.93784,.97279],YV=[.34269,.36734,.392,.41666,.44178,.46644,.49109,.51575,.54041,.56506];
const LAY={baru:{pos:(q,i)=>uv(L.cx0[q/10|0]+L.bx+i*L.bp,L.y0+(q%10)*L.rp),rn:L.R*.55/L.W,ref:true},
 lama:{pos:(q,i)=>[XU[(q/10|0)*5+i],YV[q%10]],rn:.0121*.55,ref:false}};
function readSheet(g,w,h,m,thr,tpl){
 const T=LAY[tpl],f=homog(m);
 const at=(u,v)=>{const[px,py]=f(u,v),[qx,qy]=f(u+T.rn,v);return[px,py,Math.hypot(qx-px,qy-py)]};
 let blk=null;if(T.ref){const[rx,ry,rr]=at(...uv(L.ref[0],L.ref[1]));blk=disk(g,w,h,rx,ry,rr)}
 const pts=[],ans=[],F=[],meds=[];
 for(let q=0;q<40;q++){const P=[],V=[];
  for(let i=0;i<5;i++){const t=at(...T.pos(q,i));P.push(t);V.push(disk(g,w,h,t[0],t[1],t[2]))}
  const med=[...V].sort((a,b)=>a-b)[2],den=blk!=null?Math.max(60,med-blk):Math.max(45,med*.5),f5=V.map(v=>Math.max(0,(med-v)/den));
  const o=[0,1,2,3,4].sort((a,b)=>f5[b]-f5[a]),f1=f5[o[0]],f2=f5[o[1]];
  ans.push(f1<thr?(f1>=thr*.4?'?':''):(f2>=thr&&f2>.6*f1?'*':'ABCDE'[o[0]]));pts.push(P);F.push(f5);meds.push(med)}
 const pap=[...meds].sort((a,b)=>a-b)[20];
 return{ans,pts,F,blk,pap,tpl,ok:blk==null||blk<pap*.6}}
//ENDCORE

const $=id=>document.getElementById(id),ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=Object.assign({tpl:'auto',title:'',n:40,key:Array(40).fill(''),teacher:'',thr:30},ls('ljk2_s',{})),R=ls('ljk2_r',[]),cur=null,stream=null,frozen=false,stable=0,sig='',pm=null,lastR=null;
const put=()=>{hdr();try{localStorage.setItem('ljk2_s',JSON.stringify(S));localStorage.setItem('ljk2_r',JSON.stringify(R))}catch(e){msg('Penyimpanan penuh/dikunci browser. Segera Backup JSON.')}};
const msg=(t,c)=>{$('msg').textContent=t;$('msg').dataset.k=c?(c==='busy'?'busy':c==='#d8f1e0'?'ok':c==='#fbdada'?'no':'wa'):''};
function hdr(){$('hn').textContent=S.n;$('hk').textContent=S.key.slice(0,S.n).filter(Boolean).length+'/'+S.n;$('hs').textContent=R.length;$('hm').textContent=S.title||'MTs Nurul Fata'}
function tab(i,b){document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('on',i===j));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));if(i===2)rekap()}
function keyGrid(){let h='';for(let q=0;q<40;q++){h+=`<div class="kr ${q>=S.n?'d':''}"><b>${q+1}</b>`+[...'ABCDE'].map(l=>`<button class="${S.key[q]===l?'s':''}" onclick="setKey(${q},'${l}')">${l}</button>`).join('')+'</div>'}$('kg').innerHTML=h}
function setKey(q,l){S.key[q]=S.key[q]===l?'':l;put();keyGrid();if(cur)showRes()}
function quickKey(){const t=$('qk').value.toUpperCase().replace(/[^A-E]/g,'');for(let i=0;i<40;i++)S.key[i]=t[i]||'';if(t.length&&t.length!==S.n)alert(`Anda memasukkan ${t.length} huruf, jumlah soal ${S.n}.`);put();keyGrid()}
['title','teacher'].forEach(k=>$(k).oninput=e=>{S[k]=e.target.value;put()});
$('n').onchange=e=>{S.n=Math.min(40,Math.max(1,parseInt(e.target.value)||40));e.target.value=S.n;put();keyGrid()};
$('thr').oninput=e=>{S.thr=+e.target.value;$('thv').textContent=S.thr+'%';put()};
$('title').value=S.title;$('teacher').value=S.teacher;$('n').value=S.n;$('thr').value=S.thr;$('tpl').value=S.tpl;$('thv').textContent=S.thr+'%';

function proc(src,sw,sh,max){const s=Math.min(1,max/Math.max(sw,sh)),w=Math.round(sw*s),h=Math.round(sh*s),c=$('pc');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,w,h);
 const d=x.getImageData(0,0,w,h).data,g=new Uint8Array(w*h);for(let i=0,j=0;j<g.length;i+=4,j++)g[j]=d[i]*.5+d[i+1]*.3+d[i+2]*.2;return{g,w,h,s}}
function analyze(src,sw,sh,max){const p=proc(src,sw,sh,max),m=findMarkers(p.g,p.w,p.h);if(!m){pm=null;msg(`Hanya ${MKN} kandidat kotak hitam terdeteksi (butuh 4 sudut utuh). Pastikan keempat kotak terlihat, kertas tidak terpotong, dan hindari pantulan cahaya.`,'#fde7bf');return null}
 let r=readSheet(p.g,p.w,p.h,m,S.thr/100,S.tpl==='lama'?'lama':'baru');if(S.tpl==='auto'&&!r.ok)r=readSheet(p.g,p.w,p.h,m,S.thr/100,'lama');r.m=m;r.k=1/p.s;r.p=p;if(!r.ok){msg('Bulatan REF tidak terbaca. Putar kertas, atau ganti Template ke "Lama" jika memakai LJK lama.','#fde7bf');return null}return r}
function draw(src,sw,sh,r,bg){const o=$('ov');o.width=sw;o.height=sh;const x=o.getContext('2d');x.clearRect(0,0,sw,sh);if(bg)x.drawImage(src,0,0,sw,sh);
 const k=sw/r.p.w;x.strokeStyle='#00e676';x.lineWidth=Math.max(2,sw/300);x.beginPath();[0,1,3,2,0].forEach((i,j)=>{const m=r.m[i];j?x.lineTo(m.x*k,m.y*k):x.moveTo(m.x*k,m.y*k)});x.stroke();
 for(let q=0;q<S.n;q++)for(let i=0;i<5;i++){const[px,py,rr]=r.pts[q][i],a=r.ans[q],on=a==='ABCDE'[i]||(a==='*'&&r.F[q][i]>=S.thr/100)||(a==='?'&&r.F[q][i]===Math.max(...r.F[q]));
  if(!on&&!$('dbg').checked)continue;x.beginPath();x.arc(px*k,py*k,rr*k*(on?1.5:.5),0,7);
  if(!on){x.fillStyle='rgba(255,255,0,.7)';x.fill();continue}
  const key=S.key[q];x.lineWidth=Math.max(2,sw/260);x.strokeStyle=(a==='*'||a==='?')?'#ff9800':!key?'#2196f3':a===key?'#00e676':'#ff1744';x.stroke()}}
function beep(){try{navigator.vibrate&&navigator.vibrate(80);const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}

async function startCam(){msg('Membuka kamera...','busy');try{stream&&stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:1280}}});
 const v=$('v');v.srcObject=stream;await v.play();v.style.display='';frozen=false;discard(true);msg('Arahkan kamera: 4 kotak hitam harus utuh di dalam layar.');loop()}
 catch(e){msg('Kamera tidak bisa dibuka ('+(e.name||'error')+'). Gunakan tombol "Foto HP" atau "Upload".','#fbdada')}}
function loop(){if(!stream||frozen)return;const v=$('v');
 if(v.videoWidth){const r=analyze(v,v.videoWidth,v.videoHeight,1280);
  if(r){draw(v,v.videoWidth,v.videoHeight,r,false);const s=r.ans.slice(0,S.n).join(''),mv=pm?Math.hypot(r.m[0].x-pm.x,r.m[0].y-pm.y)/r.p.w:1;pm=r.m[0];
   stable=(s===sig&&mv<.012)?stable+1:0;sig=s;msg(`Membaca... stabil ${Math.min(stable,8)}/8`,'busy');lastR=r;
   if(stable>=8&&s.replace(/[^A-E*]/g,'').length>0){frozen=true;draw(v,v.videoWidth,v.videoHeight,r,true);v.style.display='none';cur={ans:r.ans.slice(0,S.n)};beep();msg('Terkunci.','#d8f1e0');showRes();return}}
  else{const o=$('ov');o.getContext('2d').clearRect(0,0,o.width,o.height);stable=0}}
 setTimeout(loop,120)}
function loadImg(inp){const f=inp.files[0];inp.value='';if(!f)return;stream&&stream.getTracks().forEach(t=>t.stop());stream=null;frozen=true;$('v').style.display='none';discard(true);
 msg('Memproses foto...','busy');const im=new Image();im.onload=()=>{const sw=im.naturalWidth,sh=im.naturalHeight,k=Math.min(1,1600/Math.max(sw,sh)),o=$('ov');o.width=Math.round(sw*k);o.height=Math.round(sh*k);o.getContext('2d').drawImage(im,0,0,o.width,o.height);
  setTimeout(()=>{const r=analyze(im,sw,sh,1600);if(!r)return;draw(im,o.width,o.height,r,true);cur={ans:r.ans.slice(0,S.n)};msg(`Foto terbaca (template ${r.tpl}). Periksa hasil di bawah.`,'#d8f1e0');showRes();$('res').scrollIntoView({behavior:'smooth',block:'start'})},60)};
 im.onerror=()=>msg('Gambar tidak bisa dibuka.','#fbdada');im.src=URL.createObjectURL(f)}

function grade(a){let b=0,s=0,k=0;for(let q=0;q<S.n;q++){const x=a[q]||'';if(!x)k++;else if(x!=='*'&&x===S.key[q])b++;else s++}return{b,s,k,v:Math.round(b/S.n*1000)/10}}
function showRes(){$('res').style.display='';const g=grade(cur.ans),miss=[],gd=[],rg=[];
 for(let q=0;q<S.n;q++){if(!S.key[q])miss.push(q+1);if(cur.ans[q]==='*')gd.push(q+1);if(cur.ans[q]==='?')rg.push(q+1)}
 $('sc').textContent=g.v;$('sc').style.setProperty('--p',g.v+'%');$('st').innerHTML=`<div class="ok"><b>${g.b}</b><span>Benar</span></div><div class="no"><b>${g.s}</b><span>Salah</span></div><div><b>${g.k}</b><span>Kosong</span></div>`;
 $('wn').innerHTML=(miss.length?`<div class="warn">Kunci nomor ${miss.join(', ')} belum diisi, nilai belum valid.</div>`:'')+(rg.length?`<div class="warn">Arsiran kurang jelas/tidak penuh di nomor ${rg.join(', ')} (dihitung salah). Periksa kertas, lalu ketuk nomor untuk koreksi.</div>`:'')+(gd.length?`<div class="warn">Jawaban ganda di nomor ${gd.join(', ')} (dihitung salah). Ketuk untuk koreksi.</div>`:'');
 $('pl').innerHTML=cur.ans.map((a,q)=>{const k=S.key[q],c=a===''?'em':(a==='*'||a==='?')?'wa':!k?'bl':a===k?'ok':'no';return`<div class="pill ${c}" onclick="edit(${q})">${q+1}:${a||'-'}</div>`}).join('')}
function edit(q){const o=['','A','B','C','D','E'],i=o.indexOf(cur.ans[q]);cur.ans[q]=o[(i+1)%6];showRes()}
function discard(q){cur=null;$('res').style.display='none';stable=0;sig='';if(!q){$('nm').value='';if(stream){frozen=false;$('v').style.display='';msg('Arahkan kamera ke LJK berikutnya.');loop()}else{msg('Pilih cara memindai.')}}}
function save(){if(!cur)return;const nm=$('nm').value.trim()||('Siswa #'+(R.length+1)),kl=$('kl').value.trim();
 if(S.key.slice(0,S.n).some(k=>!k)&&!confirm('Kunci belum lengkap. Tetap simpan? (nilai akan dihitung ulang otomatis setelah kunci dilengkapi)'))return;
 if(R.some(r=>r.nm.toLowerCase()===nm.toLowerCase()&&r.kl===kl)&&!confirm(`"${nm}" (${kl}) sudah ada. Simpan lagi?`))return;
 R.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),nm,kl,gr:S.teacher,a:cur.ans.join(','),t:Date.now()});put();$('cnt').textContent=R.length;discard()}

function rekap(){const t=$('tb');t.innerHTML=R.map((r,i)=>{const g=grade(r.a.split(','));r.g=g;return`<div class="stu"><div class="sv">${g.v}</div><div class="in"><b>${esc(r.nm)}</b><span>${esc(r.kl||'-')} &middot; benar ${g.b}, salah ${g.s}, kosong ${g.k}</span></div><button class="noprint" aria-label="Hapus" onclick="del('${r.id}')">&times;</button></div>`}).join('')||'<div class="empty">Belum ada nilai. Pindai LJK pertama di tab Scan.</div>';
 const v=R.map(r=>r.g.v),av=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'-';
 $('stat').innerHTML=`<b>${esc(S.title||'(mapel belum diisi)')}</b> &middot; ${R.length} siswa &middot; rata-rata <b>${av}</b> &middot; tertinggi <b>${v.length?Math.max(...v):'-'}</b> &middot; terendah <b>${v.length?Math.min(...v):'-'}</b>`;
 $('ph').innerHTML=`<h3>Rekap Nilai ${esc(S.title)}</h3><p>MTs Nurul Fata &middot; ${new Date().toLocaleDateString('id-ID')}</p>`;$('cnt').textContent=R.length?R.length:''}
function del(id){if(confirm('Hapus data ini?')){R=R.filter(r=>r.id!==id);put();rekap()}}
function clr(){if(confirm('Hapus SEMUA nilai? Sudah Backup JSON?')){R=[];put();rekap()}}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function csv(){rekap();const c=s=>{s=String(s);if(/^[=+\-@]/.test(s))s="'"+s;return/[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const rows=[['No','Nama','Kelas','Guru','Benar','Salah','Kosong','Nilai','Jawaban'],...R.map((r,i)=>[i+1,r.nm,r.kl,r.gr,r.g.b,r.g.s,r.g.k,String(r.g.v).replace('.',','),r.a.replace(/,/g,'')])];
 dl(`Rekap_${(S.title||'nilai').replace(/\W+/g,'_')}.csv`,'\ufeff'+rows.map(r=>r.map(c).join(';')).join('\r\n'),'text/csv')}
function bak(){dl(`backup_ljk_${Date.now()}.json`,JSON.stringify({s:S,r:R}),'application/json')}
function imp(inp){const f=inp.files[0];inp.value='';if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t),ids=new Set(R.map(r=>r.id));let n=0;
 (d.r||[]).forEach(r=>{if(r&&r.id&&r.a&&!ids.has(r.id)){R.push(r);n++}});
 if(d.s&&JSON.stringify(d.s.key.slice(0,S.n))!==JSON.stringify(S.key.slice(0,S.n)))alert('Peringatan: kunci jawaban file ini berbeda dengan kunci di perangkat ini. Nilai dihitung dengan kunci perangkat ini.');
 put();rekap();alert(n+' data baru digabung.')}catch(e){alert('File tidak valid.')}})}
keyGrid();rekap();hdr();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
